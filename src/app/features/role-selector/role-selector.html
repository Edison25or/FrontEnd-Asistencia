<div class="selector-container">

  <div class="selector-card">

    <img src="logo-avendacom.png" alt="Avendacom" class="selector-logo">

    @if (cargando) {
      <p class="cargando">Cargando...</p>
    } @else {
      <h2 class="selector-saludo">Bienvenido, {{ userName }}</h2>
      <p class="selector-subtitulo">Selecciona cómo deseas ingresar al sistema</p>

      <div class="opciones">

        <!-- Acceder como su rol -->
        <button class="opcion-card opcion-rol" (click)="accederComoRol()">
          <div class="opcion-icono">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
            </svg>
          </div>
          <div class="opcion-texto">
            <span class="opcion-titulo">Panel de {{ rolLabel }}</span>
            <span class="opcion-desc">Gestión, reportes y administración</span>
          </div>
          <svg class="opcion-flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <!-- Acceder como trabajador -->
        <button class="opcion-card opcion-trabajador" (click)="accederComoTrabajador()">
          <div class="opcion-icono">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="opcion-texto">
            <span class="opcion-titulo">Mi Portal de Trabajador</span>
            <span class="opcion-desc">Horario, asistencia, consolidado y perfil</span>
          </div>
          <svg class="opcion-flecha" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

      </div>

      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    }

  </div>

</div>
